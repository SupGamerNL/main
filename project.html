    <li><a href="project.html?id=mo-ores-n-tools">Mo&#x27; Ores &#x27;n Tools</a>: A vanilla-friendly survival expansion that adds dozens of new ores, tools, armor sets and decorative blocks, expanding Minecraft&#x27;s material progression without machines or automation. Available for modern NeoForge and legacy Forge versions.</li>
